name: Build and publish latest release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Has wine preinstalled, needed to package the Windows build from Linux.
    container: electronuserland/builder:wine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Strip version from asset names
        run: |
          mkdir -p release-latest
          for f in release/*; do
            newname=$(basename "$f" | sed -E 's/^dbeditor-[0-9]+\.[0-9]+\.[0-9]+-/dbeditor-/')
            cp "$f" "release-latest/$newname"
          done
          cp dist/dbeditor.mjs release-latest/dbeditor.mjs

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: ci-${{ github.run_number }}
          name: "Build ${{ github.run_number }} (${{ github.sha }})"
          commit: ${{ github.sha }}
          makeLatest: true
          artifacts: release-latest/*
