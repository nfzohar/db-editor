<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="noindex">
		<title>DB Editor</title>
		<script>
			// Pick the theme before the first paint, as src/theme.js does, so dark mode doesn't flash white.
			try {
				const saved = localStorage.getItem('dbeditor.theme');
				document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			} catch {}
		</script>
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cellipse cx='8' cy='3.5' rx='6' ry='2.5' fill='%23235a81'/%3E%3Cpath d='M2 3.5v9c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-9c0 1.4-2.7 2.5-6 2.5S2 4.9 2 3.5z' fill='%23235a81' opacity='.75'/%3E%3C/svg%3E">
	</head>
	<body class="bg-white">
		<div id="app"></div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
